<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORTEX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="lang" id="lang" type="button">العربية</button>
<main>
  <section class="screen on" id="s-main">
    <span class="label" id="event"></span>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <form class="ask" id="ask" autocomplete="off">
      <input id="q" maxlength="300" enterkeyhint="send">
      <button type="button" class="mic" id="mic" hidden><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="primary" type="submit"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="panel card" id="reply" hidden aria-live="polite">
      <div class="you" id="you"></div>
      <div class="answer" id="answer"></div>
      <div class="source" id="source"></div>
      <div class="chips" id="suggest"></div>
      <div class="row">
        <button type="button" id="human"><span data-t="human"></span></button>
        <button type="button" id="mute"></button>
      </div>
    </div>
  </section>
</main>
<div class="credit">F-4029 CORTEX · Joby Thuruthel | FAIM</div>
<script src="app.js"></script>
</body>
</html>
